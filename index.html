<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to 2038</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="countdown-container">
    <h1>Countdown to January 19, 2038 03:14:07 UTC</h1>
    <div class="timer">
      <div><span id="days">0</span> Days</div>
      <div><span id="hours">0</span> Hours</div>
      <div><span id="minutes">0</span> Minutes</div>
      <div><span id="seconds">0</span> Seconds</div>
    </div>
    <p class="info">
      On this date, many 32-bit computer systems will encounter the 
      <strong>Year 2038 problem (Y2K38)</strong>, when the Unix time value will overflow and cause 
      incorrect dates and potential software errors.
    </p>
  </div>
  <script src="script.js"></script>
</body>
</html>
